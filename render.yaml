# Render Blueprint — 저장소 연결 후 Blueprint로 적용하거나, 수동 Web Service 생성 시 참고.
# https://render.com/docs/blueprint-spec
#
# 적용: Dashboard → New → Blueprint → 이 GitHub 저장소 선택 → render.yaml 인식
# (또는 README의 "Deploy to Render" 버튼 후 서비스 타입에서 Docker 확인)
#
services:
  - type: web
    name: s52viewer
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: CELL_CACHE_MAX
        value: "8"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=224"
      - key: TILE_RENDER_MAX
        value: "1"
