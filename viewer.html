<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S-52 ENC Viewer — 타일</title>
<link rel="stylesheet" href="vendor/ol.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #0b1a24; color: #d4eaee; }

  /* ── 상단 툴바 ── */
  #toolbar { display: flex; align-items: center; gap: 14px; padding: 8px 12px;
    background: #1c2733; flex-wrap: wrap; border-bottom: 1px solid #0a1218; }
  #toolbar h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 600; color: #fff; }
  #toolbar h1 small { font-weight: 400; color: #7fa8bd; font-size: 11px; }
  .grp { display: flex; align-items: center; gap: 5px; }
  .grp > label { font-size: 12px; color: #9fb4c0; }
  .seg { padding: 5px 10px; border: 1px solid #2a3742; border-radius: 4px; background: #233140;
    color: #cfe3ec; font: 600 12px "Segoe UI"; cursor: pointer; }
  .seg.active { background: #2980b9; color: #fff; border-color: #5dade2; }
  #toolbar select { padding: 5px 6px; background: #233140; color: #cfe3ec; border: 1px solid #2a3742; border-radius: 4px; font-size: 12px; }
  .chk { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #cfe3ec; cursor: pointer; }
  #focused-cell { margin-left: auto; font-weight: 700; color: #fff; background: #2980b9;
    padding: 4px 10px; border-radius: 4px; border: 1px solid #5dade2; font-size: 13px; }
  #focused-cell:empty { display: none; }

  /* ── 본문: 사이드바 + 지도 ── */
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 270px; background: #14222c; border-right: 1px solid #0a1218;
    display: flex; flex-direction: column; min-height: 0; }
  #sidebar .pad { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  #sidebar input[type=text] { width: 100%; padding: 5px 7px; background: #1c2733; color: #d4eaee;
    border: 1px solid #2a3742; border-radius: 4px; font-size: 13px; }
  #sidebar .btns { display: flex; gap: 5px; }
  #sidebar .btns button { flex: 1; padding: 5px 0; background: #233140; color: #cfe3ec;
    border: 1px solid #2a3742; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #sidebar .btns button:hover { background: #2e4255; }
  #cellcount { font-size: 11px; color: #7fa8bd; padding: 0 2px; }
  #celllist { flex: 1; overflow-y: auto; }
  .cell-row { display: flex; align-items: center; gap: 8px; padding: 5px 9px; cursor: pointer;
    border-bottom: 1px solid #1a2a35; font-size: 12.5px; }
  .cell-row:hover { background: #1c3140; }
  .cell-row.sel { background: #21506e; }
  .cell-row .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .cell-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-row .sc { color: #7fa8bd; font-size: 11px; flex-shrink: 0; }

  #map { flex: 1; position: relative; background: #d4eaee; }
  body[data-p="dusk"]  #map { background: #4a5b64; }
  body[data-p="night"] #map { background: #0a141b; }

  /* ── 상태바 ── */
  #status-bar { display: flex; align-items: center; gap: 16px; padding: 5px 12px;
    background: #1c2733; border-top: 1px solid #0a1218; font-size: 12px; color: #9fb4c0; }
  #status-bar .credit { margin-left: auto; color: #5e7889; }
  .ol-scale-line { background: rgba(28,39,51,.78); }
</style>
</head>
<body data-p="day">
  <div id="toolbar">
    <h1>S-52 ENC <small>서버 타일 렌더</small></h1>
    <div class="grp"><label>색상표</label>
      <button class="seg active" data-p="day">주간</button>
      <button class="seg" data-p="dusk">박명</button>
      <button class="seg" data-p="night">야간</button>
    </div>
    <div class="grp"><label>표시</label>
      <button class="seg" data-disp="base">기본</button>
      <button class="seg active" data-disp="standard">표준</button>
      <button class="seg" data-disp="other">상세</button>
    </div>
    <div class="grp"><label>수심</label>
      <select id="contour">
        <option value="2-10-20">2 / 10 / 20 m</option>
        <option value="5-15-30">5 / 15 / 30 m</option>
        <option value="10-30-50">10 / 30 / 50 m</option>
      </select>
    </div>
    <label class="chk"><input type="checkbox" id="scamin" checked /> SCAMIN</label>
    <div id="focused-cell"></div>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="pad">
        <input type="text" id="filter" placeholder="셀 이름 검색 (예: KR4, BUSAN)" />
        <div class="btns">
          <button id="fitAll">전체보기</button>
          <button id="goBusan">부산</button>
        </div>
        <div id="cellcount"></div>
      </div>
      <div id="celllist"></div>
    </div>
    <div id="map"></div>
  </div>

  <div id="status-bar">
    <span id="status">초기화 중…</span>
    <span class="credit">ENC S-52 · OpenLayers 타일 클라이언트</span>
  </div>

  <script src="vendor/ol.js"></script>
  <script>
    // ── S-52 설정(기본값 = 서버 캐시 키 'day' → 예열 타일 즉시) ──
    const settings = { p: "day", disp: "standard", contour: "2-10-20", scamin: true };
    document.body.dataset.p = settings.p;
    const tileUrl = () => {
      let u = `/tile/{z}/{x}/{y}.png?p=${settings.p}`;
      if (settings.disp !== "standard") u += `&disp=${settings.disp}`;
      if (settings.contour !== "2-10-20") { const [sh, sa, de] = settings.contour.split("-"); u += `&shallow=${sh}&safety=${sa}&deep=${de}`; }
      if (!settings.scamin) u += `&scamin=0`;
      return u;
    };
    const encTiles = new ol.source.XYZ({ url: tileUrl(), maxZoom: 18, minZoom: 4, transition: 150 });
    const refresh = () => encTiles.setUrl(tileUrl());

    const map = new ol.Map({
      target: "map",
      layers: [new ol.layer.Tile({ source: encTiles, preload: 2 })],
      controls: ol.control.defaults.defaults().extend([new ol.control.ScaleLine({ units: "metric" })]),
      view: new ol.View({ center: ol.proj.fromLonLat([129.04, 35.08]), zoom: 12, minZoom: 5, maxZoom: 18 }),
    });

    // ── 툴바 설정 핸들러 ──
    const segGroup = (sel, key, after) => document.querySelectorAll(sel).forEach((b) => b.addEventListener("click", () => {
      settings[key] = b.dataset[key === "p" ? "p" : "disp"];
      document.querySelectorAll(sel).forEach((x) => x.classList.toggle("active", x === b));
      if (after) after();
      refresh();
    }));
    segGroup(".seg[data-p]", "p", () => { document.body.dataset.p = settings.p; });
    segGroup(".seg[data-disp]", "disp", null);
    document.getElementById("contour").addEventListener("change", (e) => { settings.contour = e.target.value; refresh(); });
    document.getElementById("scamin").addEventListener("change", (e) => { settings.scamin = e.target.checked; refresh(); });

    // ── 셀 목록(사이드바) ──
    const bandColor = (name) => { const m = name.match(/^[A-Z]{2}(\d)/i); const b = m ? +m[1] : 0;
      return ({ 1: "#e74c3c", 2: "#e67e22", 3: "#f1c40f", 4: "#2ecc71", 5: "#3498db", 6: "#9b59b6" })[b] || "#888"; };
    const csclLabel = (c) => ({ 5000: "항만", 25000: "접근", 75000: "연안", 250000: "일반", 330000: "일반", 500000: "광역", 2000000: "총도" })[c] || ("1:" + (c || "?"));
    const focusedCell = document.getElementById("focused-cell");
    let cells = [], rows = [];

    function flyToCell(c, rowEl) {
      const ext = ol.proj.transformExtent([c.minX, c.minY, c.maxX, c.maxY], "EPSG:4326", "EPSG:3857");
      map.getView().fit(ext, { duration: 600, padding: [50, 50, 50, 50], maxZoom: 15 });
      focusedCell.textContent = c.name.replace(/\.000$/, "");
      rows.forEach((r) => r.el.classList.toggle("sel", r.el === rowEl));
    }

    function renderList(q = "") {
      const list = document.getElementById("celllist");
      list.innerHTML = "";
      rows = [];
      const needle = q.trim().toUpperCase();
      let shown = 0;
      for (const c of cells) {
        if (needle && !c.name.toUpperCase().includes(needle)) continue;
        const el = document.createElement("div");
        el.className = "cell-row";
        el.innerHTML = `<span class="dot" style="background:${bandColor(c.name)}"></span>` +
          `<span class="nm">${c.name.replace(/\.000$/, "")}</span><span class="sc">${csclLabel(c.cscl)}</span>`;
        el.addEventListener("click", () => flyToCell(c, el));
        list.appendChild(el);
        rows.push({ c, el });
        shown++;
      }
      document.getElementById("cellcount").textContent = `${shown} / ${cells.length} 셀`;
    }

    fetch("/cell-index.json").then((r) => r.json()).then((idx) => {
      // 상세(작은 cscl) 먼저, 같으면 이름순
      cells = idx.filter((c) => Number.isFinite(c.minX)).sort((a, b) => (a.cscl - b.cscl) || a.name.localeCompare(b.name));
      renderList();
    });
    document.getElementById("filter").addEventListener("input", (e) => renderList(e.target.value));
    document.getElementById("fitAll").addEventListener("click", () => {
      map.getView().fit(ol.proj.transformExtent([124, 32, 132.5, 39], "EPSG:4326", "EPSG:3857"), { duration: 600 });
      focusedCell.textContent = "";
    });
    document.getElementById("goBusan").addEventListener("click", () => {
      map.getView().animate({ center: ol.proj.fromLonLat([129.04, 35.08]), zoom: 13, duration: 600 });
    });

    // ── 상태바 ──
    const status = document.getElementById("status");
    function updateStatus() {
      const v = map.getView(), ll = ol.proj.toLonLat(v.getCenter()), z = v.getZoom();
      const denom = Math.round(v.getResolution() / 0.00028 * Math.cos(ll[1] * Math.PI / 180));
      status.textContent = `위도 ${ll[1].toFixed(4)}°  경도 ${ll[0].toFixed(4)}°   ·   줌 ${z.toFixed(1)}   ·   축척 1:${denom.toLocaleString()}`;
    }
    map.on("moveend", updateStatus);
    updateStatus();
    window.encMap = map;
  </script>
</body>
</html>
