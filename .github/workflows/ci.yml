# ENC 셀 인덱스 빌드·파서 스모크 테스트 (Vercel buildCommand와 동일 계열)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Test (S-57 샘플 파싱)
        run: npm test

      - name: Build (cell-index.json)
        run: npm run build
