<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S-52 ENC Viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  #toolbar {
    display: flex; align-items: center; gap: 14px; padding: 8px 12px;
    background: #1c2733; color: #d4eaee; flex-wrap: wrap;
  }
  #toolbar label { font-size: 13px; display: flex; align-items: center; gap: 4px; }
  /* 색상표·표시범주·수심단위 — 클릭 시 옵션 순환 */
  #toolbar .toolbar-cycle {
    display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
    min-width: 9.5em; max-width: 14em; padding: 4px 8px; margin: 0;
    font: 600 12px "Segoe UI", sans-serif; color: #d4eaee; cursor: pointer;
    background: #233140; border: 1px solid #2a3742; border-radius: 4px;
    text-align: left;
  }
  #toolbar .toolbar-cycle:hover { background: #2e4255; }
  #toolbar .toolbar-cycle .cycle-text {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #toolbar .toolbar-cycle .cycle-icon {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    width: 1.1em; height: 1.1em; font-size: 14px; line-height: 1; opacity: 0.9;
    transform-origin: 50% 50%;
  }
  #toolbar .toolbar-cycle .cycle-icon.spinning {
    animation: toolbar-cycle-spin 0.45s ease-out;
  }
  @keyframes toolbar-cycle-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  #toolbar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  #focused-cell {
    display: none;
    font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
    color: #fff; background: #2980b9; padding: 4px 10px; border-radius: 4px;
    border: 1px solid #5dade2; box-shadow: 0 0 0 1px rgba(0,0,0,.2) inset;
    max-width: min(42vw, 320px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #focused-cell:empty { display: none; }
  /* ENC 열기 — 파일/폴더 단일 드롭다운 */
  #open-enc { position: relative; display: inline-flex; align-items: center; }
  #open-enc > .hidden-file { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  #openEncBtn {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 13px "Segoe UI", sans-serif; color: #d4eaee; cursor: pointer;
    background: #233140; border: 1px solid #2a3742; border-radius: 4px;
    padding: 4px 10px;
  }
  #openEncBtn:hover, #openEncBtn[aria-expanded="true"] { background: #2e4255; }
  #openEncBtn .caret { font-size: 9px; opacity: .8; }
  #openEncMenu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
    min-width: 180px; padding: 4px; margin: 0;
    background: #1c2733; color: #d4eaee; border: 1px solid #2a3742; border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    list-style: none; display: none;
  }
  #openEncMenu[data-open] { display: block; }
  #openEncMenu button {
    width: 100%; text-align: left; padding: 6px 10px; font: 13px "Segoe UI", sans-serif;
    background: transparent; color: inherit; border: 0; cursor: pointer; border-radius: 3px;
    display: flex; align-items: center; gap: 8px;
  }
  #openEncMenu button:hover:not(:disabled) { background: #2e4255; }
  #openEncMenu button:disabled { opacity: .45; cursor: not-allowed; }
  #openEncMenu button .hint { margin-left: auto; font-size: 11px; color: #7a939c; }
  #main { flex: 1; display: flex; min-height: 0; }
  body.sidebar-collapsed #sidebar,
  body.sidebar-collapsed #sidebar-resizer { display: none; }
  #sidebar {
    width: var(--sidebar-width, 345px); min-width: 200px; max-width: min(85vw, 900px);
    flex-shrink: 0;
    background: #11181f; color: #cfe0e5; display: flex; flex-direction: column;
    border-right: 1px solid #2a3742;
  }
  #sidebar-resizer {
    flex: 0 0 5px; width: 5px; min-width: 5px; cursor: col-resize; align-self: stretch;
    background: #1a232d; border-right: 1px solid #2a3742;
    touch-action: none;
  }
  #sidebar-resizer:hover { background: #243240; }
  #sidebar-resizer.resizing { background: #2980b9; }
  #sidebar .pad { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  #sidebar input[type=text], #sidebar select { width: 100%; padding: 4px 6px; background: #1c2733; color: #d4eaee; border: 1px solid #2a3742; }
  #sidebar .btns { display: flex; gap: 4px; flex-wrap: wrap; }
  #sidebar button { flex: 1; font-size: 11px; padding: 4px 2px; background: #233140; color: #d4eaee; border: 1px solid #2a3742; cursor: pointer; }
  #sidebar button:hover { background: #2e4255; }
  #celllist { flex: 1; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; line-height: 1.35; }
  .celltree-folder { margin: 0; }
  .celltree-head {
    display: flex; align-items: center; gap: 4px; padding: 3px 6px 3px 2px;
    cursor: pointer; user-select: none; color: #9fb4bb; font-size: 12px; border-radius: 3px;
  }
  .celltree-head:hover { background: #1c2733; color: #d4eaee; }
  .celltree-head .twist { flex: 0 0 14px; width: 14px; text-align: center; font-size: 10px; color: #6d8f9a; }
  .celltree-head .dirname { font-weight: 600; color: #b8ccd4; }
  .celltree-head .celltree-count { font-size: 11px; color: #6f8088; margin-left: 2px; }
  .celltree-children {
    padding-left: 8px; margin-left: 7px;
    border-left: 1px solid #2a3742;
  }
  .celllist-view-legend {
    margin: 0 0 2px; font-size: 10px; line-height: 1.35; color: #6d8f9a;
  }
  .cellrow { display: flex; align-items: center; gap: 6px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
  .cellrow:hover { background: #1c2733; }
  /* 지도 뷰포트 밖 셀 — 목록에서만 흐리게(뷰 이동·줌 시 갱신, 검색과 무관) */
  .cellrow.out-of-viewport { opacity: 0.42; }
  .cellrow.out-of-viewport:hover { opacity: 0.62; }
  .cellrow.out-of-viewport .cellname { color: #7a8f96; }
  .cellrow.focus.out-of-viewport { opacity: 0.78; }
  .cellrow.on { background: #1f3247; }
  .cellrow.focus {
    box-shadow: inset 3px 0 0 #3498db;
    background: linear-gradient(90deg, rgba(52,152,219,0.22) 0%, transparent 55%);
  }
  .cellrow.focus.on { background: linear-gradient(90deg, rgba(52,152,219,0.28) 0%, #1f3247 50%); }
  .cellrow .cellname { color: #b8ccd4; }
  .cellrow.focus .cellname { color: #ecf6fb; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .cellrow .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  #sidebar .tabs { display: flex; flex-shrink: 0; }
  #sidebar .tab { flex: 1; padding: 8px 4px; background: #1c2733; border: none; border-bottom: 2px solid transparent; color: #9fb4bb; cursor: pointer; font-size: 13px; }
  #sidebar .tab.active { color: #d4eaee; border-bottom-color: #3498db; background: #11181f; }
  #sidebar .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #sidebar .panel[hidden] { display: none; }
  #objlist { flex: 1; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; }
  #objstat { font-size: 11px; color: #9fb4bb; line-height: 1.4; }
  .objrow { display: flex; align-items: center; gap: 6px; padding: 2px 8px; cursor: pointer; }
  .objrow:hover { background: #1c2733; }
  .objrow .ac { font-weight: 600; flex-shrink: 0; }
  .objrow .nmwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; line-height: 1.2; }
  .objrow .nm { color: #8aa0a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .objrow .ko { color: #6d8f9a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
  .objrow .cnt { margin-left: auto; color: #6f8088; padding-left: 6px; flex-shrink: 0; align-self: center; }
  .objrow.absent { opacity: .38; }
  .obj-section {
    position: sticky; top: 0; z-index: 1;
    padding: 6px 8px 4px; margin-top: 4px;
    background: linear-gradient(180deg, #1a2430 0%, #151d26 100%);
    border-top: 1px solid #2a3742; border-bottom: 1px solid #243240;
    font-size: 11px; line-height: 1.25;
  }
  .obj-section:first-child { margin-top: 0; }
  .obj-section-title { font-weight: 700; color: #7ec8f7; margin-right: 8px; }
  .obj-section-sub { color: #6d8a94; }
  .obj-empty { padding: 12px 10px; font-size: 12px; color: #7a939c; text-align: center; }
  #stage { flex: 1; position: relative; background: #73b6ef; overflow: hidden; }
  #chart { position: absolute; inset: 0; cursor: grab; }
  #chart:active { cursor: grabbing; }
  /* 버드뷰 하늘 — 기본 숨김(틸트 0). JS가 기울기에 따라 높이·표시를 제어 */
  #sky {
    position: absolute; left: 0; right: 0; top: 0; height: 0;
    pointer-events: none; z-index: 0; display: none;
    background: linear-gradient(to bottom,
      #0a1830 0%, #16335c 26%, #2f5d8f 55%, #6f97bd 82%, #b9cdd8 100%);
  }
  /* 버드뷰 거리 안개 — 위(먼 곳)로 갈수록 차트를 옅게 덮어 깊이감 부여 */
  #haze {
    position: absolute; inset: 0; pointer-events: none; z-index: 5; display: none;
    background: linear-gradient(to bottom,
      rgba(201,219,232,0.85) 0%, rgba(201,219,232,0.45) 14%,
      rgba(201,219,232,0.12) 32%, rgba(201,219,232,0) 50%);
  }
  body.birdview #sky, body.birdview #haze { display: block; }
  /* 축척 오버레이 */
  #scale-bar {
    position: absolute; left: 10px; bottom: 10px; z-index: 6; pointer-events: none;
    font-size: 11px; font-weight: 600; color: #1a2530;
    text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 1px 0 rgba(255,255,255,.9);
    user-select: none;
  }
  #scale-bar .track {
    height: 5px; margin-top: 2px; background: rgba(255,255,255,.88);
    border: 1px solid rgba(26,37,48,.75); border-radius: 1px;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  #scale-bar .label { display: block; margin-bottom: 1px; white-space: nowrap; }
  #status-bar {
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    padding: 5px 12px; background: #11181f; color: #9fb4bb; font-size: 12px;
    border-top: 1px solid #2a3742;
  }
  #status {
    flex: 1; min-width: 0;
    font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  a.doc-page {
    flex-shrink: 0; font-size: 12px; color: #7ec8f7; text-decoration: none; white-space: nowrap;
  }
  a.doc-page:hover { text-decoration: underline; }
  #toolbar a.doc-page { font-size: 13px; margin-left: 2px; }
  #status-bar .doc-page-mobile,
  #status-bar .mobile-app-title { display: none; }
  @media (max-width: 768px) {
    #status-bar .doc-page-mobile { display: inline; }
    #status-bar .mobile-app-title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      padding: 0;
      color: #d4eaee;
      flex-shrink: 0;
      line-height: 1.2;
    }
  }
  #app-credit {
    flex-shrink: 0; font-size: 11px; color: #7a939c; white-space: nowrap;
  }
  #map-loading { display: none; }
  /* 모바일: 지도만 전체 화면 */
  @media (max-width: 768px) {
    html, body { height: 100%; height: 100dvh; }
    #toolbar, #sidebar, #sidebar-resizer { display: none !important; }
    #main { flex: 1; min-height: 0; min-height: 100dvh; }
    #stage { flex: 1; min-height: 0; }
    #status-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
      justify-content: center;
      flex-wrap: wrap;
      row-gap: 4px;
      column-gap: 10px;
      padding: 5px 10px max(6px, env(safe-area-inset-bottom));
    }
    #status-bar #app-credit {
      white-space: normal;
      text-align: center;
      max-width: 100%;
      line-height: 1.35;
    }
    #status { display: none; }
    #chart {
      touch-action: none;
      bottom: max(44px, calc(env(safe-area-inset-bottom) + 34px));
    }
    #scale-bar {
      left: 8px;
      bottom: max(44px, calc(env(safe-area-inset-bottom) + 32px));
      font-size: 10px;
    }
    #map-loading:not([hidden]) {
      display: block;
      position: fixed;
      bottom: max(52px, calc(env(safe-area-inset-bottom) + 42px));
      left: 50%; transform: translateX(-50%); z-index: 20;
      max-width: min(92vw, 360px); padding: 8px 14px; border-radius: 10px;
      background: rgba(0,0,0,.72); color: #fff; font-size: 13px;
      text-align: center; pointer-events: none;
    }
    #map-loading.map-load-error:not([hidden]) {
      background: rgba(120, 20, 20, .92);
      pointer-events: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  }
</style>
</head>
<body class="sidebar-collapsed">
  <div id="toolbar">
    <h1>S-52 ENC Viewer</h1>
    <a href="about.html" class="doc-page">프로그램 설명</a>
    <span id="focused-cell" title="지도에서 마지막으로 포커스한 ENC 셀(.000)"></span>
    <span id="open-enc">
      <button type="button" id="openEncBtn" aria-haspopup="menu" aria-expanded="false" title="ENC 셀(.000)을 파일 또는 폴더 단위로 엽니다">
        ENC 열기 <span class="caret" aria-hidden="true">▾</span>
      </button>
      <ul id="openEncMenu" role="menu" aria-labelledby="openEncBtn">
        <li role="none"><button type="button" role="menuitem" data-action="files">파일 선택… <span class="hint">.000 다중</span></button></li>
        <li role="none"><button type="button" role="menuitem" data-action="folder">폴더 선택… <span class="hint">.000 일괄</span></button></li>
      </ul>
      <input type="file" id="file" class="hidden-file" multiple accept=".000,.001,.002,*" />
      <input type="file" id="folder" class="hidden-file" webkitdirectory directory multiple />
    </span>
    <label>색상표:
      <button type="button" class="toolbar-cycle" id="palette" value="DAY_BRIGHT" title="클릭하여 색상표 순환">
        <span class="cycle-text">DAY_BRIGHT</span><span class="cycle-icon" aria-hidden="true">↻</span>
      </button>
    </label>
    <label>표시범주:
      <button type="button" class="toolbar-cycle" id="dispcat" value="Standard" title="클릭하여 표시범주 순환 (Base → Standard → All/Other)">
        <span class="cycle-text">Standard</span><span class="cycle-icon" aria-hidden="true">↻</span>
      </button>
    </label>
    <label>수심단위:
      <button type="button" class="toolbar-cycle" id="depthunit" value="m" title="클릭하여 수심 단위 순환">
        <span class="cycle-text">미터(m)</span><span class="cycle-icon" aria-hidden="true">↻</span>
      </button>
    </label>
    <label><input type="checkbox" id="grid" /> 셀 격자</label>
    <label><input type="checkbox" id="graticule" /> 경위도선</label>
    <label title="충분히 축소하면 자동으로 3D 지구본으로 전환. 확대하면 다시 2D 머케이터로 복귀."><input type="checkbox" id="globe3d" checked /> 3D 지구본</label>
    <label title="육지 영역에 위성 영상을 겹쳐 표시(바다는 S-52 차트 유지). 영상: Esri World Imagery."><input type="checkbox" id="satellite" /> 위성지도</label>
    <label><input type="checkbox" id="sidebarVisible" /> 셀 목록(좌측)</label>
  </div>
  <div id="main">
    <div id="sidebar">
      <div class="tabs">
        <button id="tabCells" class="tab active">셀</button>
        <button id="tabObjs" class="tab">오브젝트</button>
      </div>
      <div id="panelCells" class="panel">
        <div class="pad">
          <p class="celllist-view-legend">지도와 겹치는 셀은 각 폴더 안에서 위쪽에 모이고 선명하게, 화면 밖 셀은 아래·흐리게 표시됩니다.</p>
          <input type="text" id="filter" placeholder="셀 이름 검색…" />
          <div class="btns">
            <button id="showVisible">보이는영역 표시</button>
            <button id="hideAll">모두 숨김</button>
            <button id="fitAll">전체보기</button>
          </div>
        </div>
        <div id="celllist"></div>
      </div>
      <div id="panelObjs" class="panel" hidden>
        <div class="pad">
          <select id="objscope"><option value="">표시 중 전체(합산)</option></select>
          <input type="text" id="objfilter" placeholder="오브젝트 검색(약어/이름)…" />
          <label style="font-size:11px;"><input type="checkbox" id="objShowAll" /> 전체 카탈로그 보기(미포함 포함)</label>
          <label style="font-size:11px;" title="상단 도구줄 표시범주(Base/Standard/All)와 같을 때만 그려질 수 있는 오브젝트만 목록에 남깁니다.">
            <input type="checkbox" id="objMatchDispcat" /> 표시범주에 맞춰 목록 축소
          </label>
          <div class="btns">
            <button id="objAll">모두 표시</button>
            <button id="objNone">모두 숨김</button>
          </div>
          <div id="objstat"></div>
        </div>
        <div id="objlist"></div>
      </div>
    </div>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="셀 목록 패널 너비 조절" title="드래그하여 너비 조절"></div>
    <div id="stage">
      <!-- 버드뷰 하늘(차트 위쪽 지평선 너머). 기울기에 따라 높이가 커짐 -->
      <div id="sky" aria-hidden="true"></div>
      <canvas id="chart"></canvas>
      <!-- 버드뷰 거리 안개(먼 쪽=위로 갈수록 흐려짐) -->
      <div id="haze" aria-hidden="true"></div>
      <div id="scale-bar" aria-hidden="true">
        <span class="label" id="scale-bar-label"></span>
        <div class="track" id="scale-bar-track"></div>
      </div>
    </div>
  </div>
  <div id="status-bar">
    <div id="status">초기화 중…</div>
    <h1 class="mobile-app-title">S-52 ENC Viewer</h1>
    <a href="about.html" class="doc-page doc-page-mobile">프로그램 설명</a>
    <div id="app-credit">제작: 지엠티 김길용 수석 · v0.2.4 (2026.05.31)</div>
  </div>
  <div id="map-loading" hidden>로딩 중…</div>
  <script type="module" src="js/main.js?v=87"></script>
</body>
</html>
