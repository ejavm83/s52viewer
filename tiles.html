<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>S-52 ENC — 타일 뷰어 (서버 렌더)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="vendor/ol.css">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1a24; }
    #map { position: absolute; inset: 0; background: #d4eaee; } /* DEPDW 바다색 = 미로드 타일 배경 */
    /* 차트는 우리가 서버에서 굽는 타일이라 라벨이 선명하도록 보간 끔 */
    #map canvas { image-rendering: -webkit-optimize-contrast; }
    .badge {
      position: absolute; left: 10px; top: 10px; z-index: 5;
      background: rgba(11,26,36,.82); color: #d8eef6; font: 13px/1.4 system-ui, sans-serif;
      padding: 8px 11px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.3); max-width: 320px;
    }
    .badge b { color: #7fd3ff; }
    .badge .hint { color: #9fb4c0; font-size: 12px; }
    .ol-zoom { top: auto; bottom: 1.2em; left: auto; right: .8em; }
    .palette { margin-top: 8px; display: flex; gap: 6px; }
    .palette button {
      flex: 1; padding: 5px 0; border: 1px solid #2c4654; border-radius: 6px;
      background: #16303c; color: #b9d3df; font: 12px system-ui, sans-serif; cursor: pointer;
    }
    .palette button.active { background: #2b6fa0; color: #fff; border-color: #3b8fc8; }
    .setrow { margin-top: 6px; display: flex; align-items: center; gap: 6px; }
    .setrow > span { width: 30px; color: #9fb4c0; font-size: 12px; }
    .seg { flex: 1; padding: 4px 0; border: 1px solid #2c4654; border-radius: 6px;
      background: #16303c; color: #b9d3df; font: 12px system-ui, sans-serif; cursor: pointer; }
    .seg.active { background: #2b6fa0; color: #fff; border-color: #3b8fc8; }
    .setrow select { flex: 1; background: #16303c; color: #b9d3df; border: 1px solid #2c4654;
      border-radius: 6px; padding: 4px; font: 12px system-ui, sans-serif; }
    .chk { display: flex; align-items: center; gap: 4px; color: #b9d3df; font-size: 12px; cursor: pointer; }
    /* 미로드 타일 배경을 팔레트에 맞춤(주=바다색, 야=어두운색) */
    body[data-p="day"]   #map { background: #d4eaee; }
    body[data-p="dusk"]  #map { background: #4a5b64; }
    body[data-p="night"] #map { background: #0a141b; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="badge">
    <div><b>S-52 ENC 타일 뷰어</b> — 서버가 ENC를 PNG로 렌더링</div>
    <div class="hint">이동/확대 시 벡터 렌더 0회 · 캐시된 타일 이미지만 합성(레퍼런스와 동일 방식)</div>
    <div class="palette">
      <button data-p="day" class="active">주간</button>
      <button data-p="dusk">박명</button>
      <button data-p="night">야간</button>
    </div>
    <div class="setrow"><span>표시</span>
      <button class="seg" data-disp="base">기본</button>
      <button class="seg active" data-disp="standard">표준</button>
      <button class="seg" data-disp="other">상세</button>
    </div>
    <div class="setrow"><span>수심</span>
      <select id="contour">
        <option value="2-10-20">2 / 10 / 20 m</option>
        <option value="5-15-30">5 / 15 / 30 m</option>
        <option value="10-30-50">10 / 30 / 50 m</option>
      </select>
      <label class="chk"><input type="checkbox" id="scamin" checked> SCAMIN</label>
    </div>
  </div>
  <script src="vendor/ol.js"></script>
  <script>
    const BUSAN = [129.04, 35.08];
    // 모든 S-52 설정. 기본값은 서버 캐시 키 'day'와 일치 → 예열된 타일을 그대로 사용.
    const settings = { p: "day", disp: "standard", contour: "2-10-20", scamin: true };
    document.body.dataset.p = settings.p;
    const tileUrl = () => {
      let u = `/tile/{z}/{x}/{y}.png?p=${settings.p}`;
      if (settings.disp !== "standard") u += `&disp=${settings.disp}`;
      if (settings.contour !== "2-10-20") { const [sh, sa, de] = settings.contour.split("-"); u += `&shallow=${sh}&safety=${sa}&deep=${de}`; }
      if (!settings.scamin) u += `&scamin=0`;
      return u;
    };
    const refresh = () => encTiles.setUrl(tileUrl());
    const encTiles = new ol.source.XYZ({
      url: tileUrl(),                 // 서버사이드 S-52 렌더(디스크 캐시), 설정별 캐시 키
      maxZoom: 18,
      minZoom: 4,
      tilePixelRatio: 1,
      transition: 150,                // 타일 페이드인(부드러운 첫 표시)
      attributions: "ENC S-52 · 서버 렌더 타일",
    });
    const map = new ol.Map({
      target: "map",
      layers: [ new ol.layer.Tile({ source: encTiles, preload: 2 }) ],
      view: new ol.View({
        center: ol.proj.fromLonLat(BUSAN),
        zoom: 12,
        minZoom: 5,
        maxZoom: 18,
        constrainResolution: false,   // 부드러운 연속 확대(스냅 없음)
      }),
      // OpenLayers가 이동/확대/관성/타일로딩/합성을 모두 처리(레퍼런스와 동일)
    });

    // 설정 변경 → XYZ URL만 바꿔 OL이 새 타일을 다시 가져온다(클라이언트 벡터 렌더 없음).
    document.querySelectorAll(".palette button").forEach((btn) => {
      btn.addEventListener("click", () => {
        settings.p = btn.dataset.p;
        document.body.dataset.p = settings.p;
        document.querySelectorAll(".palette button").forEach((b) => b.classList.toggle("active", b === btn));
        refresh();
      });
    });
    document.querySelectorAll(".seg[data-disp]").forEach((btn) => {
      btn.addEventListener("click", () => {
        settings.disp = btn.dataset.disp;
        document.querySelectorAll(".seg[data-disp]").forEach((b) => b.classList.toggle("active", b === btn));
        refresh();
      });
    });
    document.getElementById("contour").addEventListener("change", (e) => { settings.contour = e.target.value; refresh(); });
    document.getElementById("scamin").addEventListener("change", (e) => { settings.scamin = e.target.checked; refresh(); });

    // 간단한 로딩 카운터(콘솔) — 서버 렌더 진행 확인용
    let loading = 0;
    encTiles.on("tileloadstart", () => { loading++; });
    encTiles.on("tileloadend", () => { loading--; });
    encTiles.on("tileloaderror", () => { loading--; });
    window.encMap = map; // 디버그 핸들
  </script>
</body>
</html>
